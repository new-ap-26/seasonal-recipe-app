name: Branch Build Check

on:
  push:
    branches: [chore/connector-write-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
